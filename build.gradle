buildscript {
    ext {
        compose_version = '1.1.1'
        compose_runtime_version = '1.0.1'
        dagger_hilt_version = '2.53'
        moshi_converter_version = '2.9.0'
        moshi_version = '1.14.0'
        retrofit_version = '2.9.0'
        logging_interceptor = '4.10.0'
        coil_compose_version = '2.2.2'
        lifecycle_version = '2.4.0'
        lifecycle_compose_version = '2.6.0-alpha02'
        hilt_navigation_version = '1.2.0'
        material3_version = '1.0.0'
        timber_version = '5.0.1'
        coroutines_test_version = '1.6.4'
        turbine_test_version = '0.8.0'
        navigation_compose_version = '2.8.9'
        okhttp_version = '4.10.0'
        datastore_version = '1.0.0'
        room_version = '2.5.1'
    }
}

plugins {
    id 'com.android.application' version '8.1.0' apply false
    id 'com.android.library' version '8.1.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.1.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20'
    id 'com.google.dagger.hilt.android' version '2.53' apply false
    id 'org.jlleitschuh.gradle.ktlint' version '11.3.2'
}
